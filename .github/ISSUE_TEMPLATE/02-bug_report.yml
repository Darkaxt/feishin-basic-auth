name: BasicAuth bug report
description: Report a reverse-proxy BasicAuth or proxy-auth issue in this fork.
title: '[BasicAuth Bug] '
labels: ['bug', 'basic-auth', 'proxy-auth']
body:
    - type: checkboxes
      id: scope
      attributes:
          label: Scope check
          options:
              - label: This issue is about reverse-proxy BasicAuth/proxy-auth behavior in this fork.
                required: true
              - label: I have already checked existing issues and found no duplicate.
                required: true

    - type: input
      id: version
      attributes:
          label: Feishin BasicAuth version
          description: What version of this fork are you running?
          placeholder: ex. 1.11.0-ba.2
      validations:
          required: true

    - type: input
      id: server-version
      attributes:
          label: Music Server and Version
          description: What music server are you using?
          placeholder: ex. Navidrome v0.55.0, LMS v3.67.0, Jellyfin v10.10.7, etc.
      validations:
          required: true

    - type: dropdown
      id: proxy
      attributes:
          label: Reverse proxy
          options:
              - Traefik
              - nginx
              - Caddy
              - Apache
              - Authelia
              - Authentik
              - Cloudflare Access
              - Other
      validations:
          required: true

    - type: dropdown
      id: proxy-auth-mode
      attributes:
          label: Proxy auth setup
          options:
              - Dedicated proxy BasicAuth fields
              - URL credentials workaround
              - Other
      validations:
          required: true

    - type: dropdown
      id: playback-backend
      attributes:
          label: Playback backend
          options:
              - Web player
              - MPV
              - Both
              - Not playback-related
      validations:
          required: true

    - type: dropdown
      id: environment
      attributes:
          label: Environment
          multiple: true
          options:
              - Desktop Windows
              - Desktop macOS
              - Desktop Linux
              - Other

    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Also tell us, what did you expect to happen?
          placeholder: Include screenshots and error logs if possible. The browser devtools can be opened using CTRL + SHIFT + I (Windows/Linux) or CMD + SHIFT + I (macOS).
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Steps to reproduce
          description: How can we reproduce this issue? Are there any specific settings that are enabled that could be the cause?
          placeholder: |
              1. Go to '...'
              2. Click on '....'
              3. Scroll down to '....'
              4. See error
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Redacted log output
          description: Paste relevant logs with passwords, tokens, cookies, and BasicAuth headers removed.
          render: shell
